services:
  database:
    image: postgres:16
    environment:
      POSTGRES_HOST_AUTH_METHOD: password
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_NON_ROOT_USER: ${POSTGRES_NON_ROOT_USER}
      POSTGRES_NON_ROOT_PASSWORD: ${POSTGRES_NON_ROOT_PASSWORD}
    volumes:
      - ./data/postgres-data:/var/lib/postgresql/data
      - ./src/postgres/init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    ports:
      - "5432:5432"
    env_file: 
      - ./data/.env.postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  conjur:
    image: cyberark/conjur
    command: server
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database/postgres
      CONJUR_AUTHENTICATORS: authn-jwt/n8n,authn
      CONJUR_TELEMETRY_ENABLED: 'false'
      CONJUR_LOG_LEVEL: debug
    env_file: 
      - ./data/.env.conjur
      - ./data/.env.postgres
    depends_on:
      - database
    restart: on-failure
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      
  traefik:
    image: "traefik"
    profiles:
      - do_not_start
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.mytlschallenge.acme.tlschallenge=true"
      - "--certificatesresolvers.mytlschallenge.acme.email=${SSL_EMAIL}"
      - "--certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    env_file: 
      - ./data/.env.n8n
    volumes:
      - traefik_data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro

  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: always
    ports:
      - "5678:5678"
    labels:
      - traefik.enable=false
      - traefik.http.routers.n8n.rule=Host(`${SUBDOMAIN}.${DOMAIN_NAME}`)
      - traefik.http.routers.n8n.tls=true
      - traefik.http.routers.n8n.entrypoints=web,websecure
      - traefik.http.routers.n8n.tls.certresolver=mytlschallenge
      - traefik.http.middlewares.n8n.headers.SSLRedirect=true
      - traefik.http.middlewares.n8n.headers.STSSeconds=315360000
      - traefik.http.middlewares.n8n.headers.browserXSSFilter=true
      - traefik.http.middlewares.n8n.headers.contentTypeNosniff=true
      - traefik.http.middlewares.n8n.headers.forceSTSHeader=true
      - traefik.http.middlewares.n8n.headers.SSLHost=${DOMAIN_NAME}
      - traefik.http.middlewares.n8n.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.n8n.headers.STSPreload=true
      - traefik.http.routers.n8n.middlewares=n8n@docker
    env_file: 
      - ./data/.env.postgres
      - ./data/.env.n8n
    environment:
      - N8N_HOST=${DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://${DOMAIN_NAME}:5678/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - N8N_SECURE_COOKIE=false
      - CREDENTIALS_OVERWRITE_ENDPOINT=send-credentials
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=database
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_NON_ROOT_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_NON_ROOT_PASSWORD}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./src/n8n:/home/node/import
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      database:
        condition: service_healthy



  llm-guard:
    build:
      context: ./src/llm-guard
#    image: llm-guard-api:latest
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    runtime: nvidia
    environment:
      USE_GPU: true
      LLMGUARD_API_TOKEN: ${LLMGUARD_API_TOKEN:-}
      TRANSFORMERS_CACHE: /root/.cache/huggingface
      HF_HOME: /root/.cache/huggingface
      TRANSFORMERS_NO_META_DEVICE: "1"
    ports:
      - "4321:4321"    # expose for local dev; omit in prod if only intra-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4321/healthz"]
      interval: 10s
      timeout: 10s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    depends_on:
      llm-guard:
        condition: service_healthy
    environment:
      - LLMGUARD_API_BASE=http://host.docker.internal:4321
      - LLMGUARD_API_TOKEN=${LLMGUARD_API_TOKEN:-}
      - OLLAMA_API_BASE=http://host.docker.internal:11434
    env_file: 
      - ./data/.env.litellm
    ports:
      - "4000:4000"
    volumes:
      - ./src/litellm/config.yaml:/app/config.yaml:ro
      - ./src/litellm/custom_llmguard.py:/app/custom_llmguard.py:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--detailed_debug"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

